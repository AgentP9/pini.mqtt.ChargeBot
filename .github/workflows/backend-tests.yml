name: Backend regression tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - run: node ../tests/test-diagnostics.js
      - run: node ../tests/test-auto-off-observability.js
      - run: node --check storage.js
      - run: node ../tests/test-process-integrity.js
      - run: node ../tests/test-backup-rotation.js
      - run: node --check recovery-cli.js
      - run: node ../tests/test-storage-failures.js
      - run: node --check mqttRecovery.js
      - run: node ../tests/test-mqtt-recovery.js
      - run: node ../tests/test-energy-integration.mjs
      - run: node ../tests/run-completion-scenarios.js
      - run: node ../tests/test-completion-replay.js
      - run: node ../tests/test-completion-detection.js
      - run: node ../tests/test-auto-off-persistence.js
      - run: node ../tests/test-pattern-identification.js
      - run: node ../tests/test-appliance-detection.js
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
